server:
  servlet:
    context-path: /casaDaVedacao/API

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/casa_da_vedacao # Banco dedicado
    username: postgres
    password: 2512
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update # Mantenha para criação automática das tabelas
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  springdoc:
    swagger-ui:
      path: /public/swagger